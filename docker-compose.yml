services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: kbb, POSTGRES_USER: kbb, POSTGRES_PASSWORD: kbb }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbb -d kbb"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:latest
    command: >
      redpanda start --mode dev-container --smp 1 --memory 512M
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  central-api:
    build: ./services/central-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kbb
      SPRING_DATASOURCE_USERNAME: kbb
      SPRING_DATASOURCE_PASSWORD: kbb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ORS_API_KEY: ${ORS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PHOTOS_DIR: /photos
    ports: ["8080:8080"]
    volumes: [photos:/photos]
    depends_on:
      db: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  vision-service:
    build: ./services/vision-service
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      PHOTOS_DIR: /photos
    ports: ["8000:8000"]
    volumes: [photos:/photos]
    depends_on:
      redpanda: { condition: service_healthy }

  web:
    build: ./mobile
    ports: ["3000:80"]
    depends_on:
      central-api: { condition: service_healthy }

volumes: { dbdata: {}, photos: {} }
