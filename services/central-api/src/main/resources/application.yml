server:
  port: 8080

spring:
  application:
    name: central-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kbb}
    username: ${SPRING_DATASOURCE_USERNAME:kbb}
    password: ${SPRING_DATASOURCE_PASSWORD:kbb}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
    consumer:
      group-id: central-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-days: 30
  photos-dir: ${PHOTOS_DIR:./photos}
  cors:
    extra-origins: ${CORS_EXTRA_ORIGINS:}
  seed:
    enabled: ${SEED_ENABLED:true}
  ors:
    api-key: ${ORS_API_KEY:}
    base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}
    cache-minutes: 10
  overpass:
    # comma-separated mirrors tried in order; blank -> built-in default list (see OverpassAdapter.DEFAULT_URLS)
    urls: ${OVERPASS_URLS:${OVERPASS_URL:}}
    snapshot: classpath:seed/osm_krakow_center.json
    startup-import: ${OVERPASS_STARTUP_IMPORT:true}
    cron: ${OVERPASS_CRON:0 0 4 * * *}
  admin-token: ${ADMIN_TOKEN:}
  crowd:
    recompute-ms: 300000
    cell-m: ${CROWD_CELL_M:100} # honeycomb cell size (flat side to flat side), m
    # prototype: busy Old Town / quiet outskirts on top of real data (set CROWD_DEMO=false to disable)
    demo: ${CROWD_DEMO:true}
  gtfs:
    # ZTP Kraków open GTFS feeds (trams, buses); empty = skip transit in the crowd base
    urls: ${GTFS_URLS:https://gtfs.ztp.krakow.pl/GTFS_KRK_T.zip,https://gtfs.ztp.krakow.pl/GTFS_KRK_A.zip}
    cron: ${GTFS_CRON:0 30 4 * * MON}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
